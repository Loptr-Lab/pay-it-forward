name: Deploy PLAY IT FORWARD to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
        env:
          GITHUB_PAGES: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify IndexNow about published pages
        env:
          INDEXNOW_KEY: a3a285cf09b84a3ba9128082e43c87b4
        run: |
          curl --fail-with-body --silent --show-error -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d '{
              "host": "loptr-lab.github.io",
              "key": "'"${INDEXNOW_KEY}"'",
              "keyLocation": "https://loptr-lab.github.io/pay-it-forward/'"${INDEXNOW_KEY}"'.txt",
              "urlList": [
                "https://loptr-lab.github.io/pay-it-forward/",
                "https://loptr-lab.github.io/pay-it-forward/adventure/",
                "https://loptr-lab.github.io/pay-it-forward/route/"
              ]
            }'
