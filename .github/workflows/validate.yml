name: Validate PLAY IT FORWARD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Verify generated SEO and RSS assets
        run: |
          test -f out/sitemap.xml
          test -f out/robots.txt
          test -f out/field-notes/feed.xml
          grep -q '<rss version="2.0"' out/field-notes/feed.xml
          grep -q 'field-notes/media-resources' out/sitemap.xml
          grep -q 'field-notes/atproto-music-discovery' out/sitemap.xml
